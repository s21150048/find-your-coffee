<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIND YOUR COFFEE</title>
<style>
:root{--bg:#f8f3ea;--paper:#fffdf9;--ink:#2e251f;--sub:#74685e;--line:#ded1c3;--brown:#75462f;--gold:#b88647;--soft:#f1e3d2;--green:#587564}
*{box-sizing:border-box}body{margin:0;padding:18px;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:820px;margin:auto;padding:22px;border-radius:24px;background:var(--bg)}.hero{text-align:center;padding:18px 8px}.kicker{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--gold)}h1{font-family:Georgia,"Times New Roman",serif;font-size:36px;letter-spacing:.05em;margin:6px 0}.subtitle,.intro,.help,.result p,.foot{color:var(--sub);line-height:1.7}.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:0 8px 25px rgba(72,48,32,.07)}.modes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mode,.opt{appearance:none;-webkit-appearance:none;width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}.mode{border-radius:17px;padding:20px}.mode b{display:block;font-family:Georgia,serif;font-size:19px;color:var(--brown)}.mode strong{display:block;font-size:17px;margin:6px 0}.mode span{display:block;color:var(--sub);font-size:13px;line-height:1.6}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:15px 0 6px}.bar{height:100%;background:linear-gradient(90deg,var(--brown),var(--gold))}.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-bottom:12px}.q h2{font-size:21px;line-height:1.5;margin:0 0 6px}.help{font-size:13px;margin-bottom:15px}.info{background:var(--soft);border-radius:12px;padding:11px 13px;margin:9px 0 15px;font-size:13px;line-height:1.65}.opts{display:grid;gap:10px}.opt{border-radius:14px;padding:13px 15px;outline:none}.opt b{display:block;font-size:15px}.opt small{display:block;color:var(--sub);margin-top:3px;font-size:12px;line-height:1.5}.opt.selected{border-color:var(--gold);background:#fff8ee;box-shadow:0 0 0 3px rgba(184,134,71,.16)}.mode:focus,.opt:focus{outline:none}.mode:focus-visible,.opt:focus-visible{outline:2px dashed #675d55;outline-offset:3px}.nav{display:flex;gap:9px;margin-top:17px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.back{background:var(--line);color:var(--ink)}.next,.restart{background:var(--brown);color:#fff;margin-left:auto}.btn:disabled{opacity:.4;cursor:not-allowed}.result-intro{text-align:center}.result-intro .en{font-family:Georgia,serif;letter-spacing:.12em;color:var(--gold);font-weight:800}.result{border:1px solid var(--line);border-radius:17px;padding:17px;margin-top:13px}.result.best{border:2px solid var(--brown);background:#fffbf5}.result.second{border-left:6px solid var(--gold)}.result.new{border-left:6px solid var(--green)}.tag{display:inline-block;border-radius:99px;background:var(--soft);padding:5px 10px;font-size:11px;font-weight:900}.result h3{font-family:Georgia,serif;font-size:24px;color:var(--brown);margin:9px 0 2px}.jp{font-weight:800;font-size:17px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0}.spec{background:var(--bg);border-radius:11px;padding:10px;font-size:13px}.spec b{display:block;color:var(--sub);font-size:10px;margin-bottom:3px}.shop{background:var(--soft);border-radius:11px;padding:12px;line-height:1.65}.foot{font-size:12px;margin-top:15px}.actions{text-align:center;margin-top:16px}@media(hover:hover) and (pointer:fine){.mode:hover,.opt:not(.selected):hover{border-color:#bba78f;background:#fffaf4}}@media(max-width:560px){body{padding:0}.app{padding:13px;border-radius:0}.hero h1{font-size:28px}.modes,.specs{grid-template-columns:1fr}.card{padding:16px}}@media(prefers-color-scheme:dark){:root{--bg:#211b17;--paper:#2c241f;--ink:#fff8ef;--sub:#c8b9aa;--line:#504137;--brown:#d28a5a;--gold:#ddb279;--soft:#493426;--green:#78ad8d}.opt.selected,.result.best{background:#3d2d23}}
</style>
</head>
<body><main class="app" id="coffeeApp"><header class="hero"><div class="kicker">COFFEE TASTE DIAGNOSIS</div><h1>FIND YOUR COFFEE</h1><div class="subtitle">あなたの好みに合う一杯を見つけよう</div></header><section class="card"><noscript><div class="info">この表示環境では診断機能を実行できません。Safari、Chrome、Edgeで開くか、Web上に公開してご利用ください。</div></noscript><div id="stage"></div></section></main>
<script>
(()=>{const root=document.getElementById('coffeeApp'),stage=document.getElementById('stage');
const qs=[
{k:'flavor',t:'どんな味や香りにひかれますか？',h:'普段好きな食べ物や香りを思い浮かべて、直感で選んでください。',a:[['classic','チョコレートやナッツのような香ばしさ','焼き菓子のように親しみやすい香り'],['sweet','はちみつやキャラメルのような甘さ','やさしく丸みのある印象'],['floral','花や紅茶のような華やかさ','軽やかで上品な香り'],['fruit','ベリーや桃のような果実感','甘酸っぱく豊かな香り'],['deep','カカオやスパイスのような深み','香ばしく複雑な味わい']]},
{k:'acid',t:'果物のような酸味は？',h:'柑橘や果物のような、明るく爽やかな酸味を想像してください。',a:[['low','できるだけ穏やかに','酸味より香ばしさやコクを楽しみたい'],['mild','甘さの中に少し','強すぎない爽やかさなら楽しみたい'],['high','はっきり楽しみたい','果物のような明るさが好き'],['unknown','まだよく分からない','極端ではないものから試したい']]},
{k:'body',t:'どんな口当たりが好き？',h:'飲んだときの軽さや、コクの感じ方で選んでください。',a:[['clean','軽やかですっきり','紅茶のように軽く、後味もすっきり'],['soft','やさしく、まろやか','苦味や酸味の角が少なく、口当たりがやわらかい'],['balanced','ほどよいコク','軽すぎず重すぎないバランス型'],['rich','しっかりしたコクと飲みごたえ','味わいが豊かで余韻が長く残る']]},
{k:'drink',t:'普段いちばん多い飲み方は？',h:'いつもの飲み方を選んでください。',a:[['black','ホットのブラック',''],['milk','ミルク入り',''],['ice','アイスコーヒー',''],['variety','いろいろ楽しみたい','']]},
{k:'adventure',t:'どのくらい新しい味を試したい？',h:'今回選びたい一杯の方向で答えてください。',a:[['safe','まずは飲みやすい王道',''],['medium','少し個性も楽しみたい',''],['wild','驚きのある味を試したい','']]},
{k:'process',pro:true,t:'どんな風味の方向が好き？',h:'方法の名前が分からなくても、味のイメージで選べます。',i:'コーヒーは、収穫後に果実から豆を取り出す「精製方法」によって、甘さや香り、後味が変わります。',a:[['washed','すっきり、クリーン','ウォッシュド系｜味の輪郭が分かりやすく、後味がきれい'],['honey','まろやかで甘い','ハニー系｜やさしい甘さと丸みのある口当たり'],['natural','果実の香りが豊か','ナチュラル系｜ベリーや熟した果物のような甘い香り'],['ferment','発酵感や洋酒のような個性','アナエロビックなど｜トロピカルフルーツや洋酒を思わせる香り'],['neutral','よく分からない／おまかせ','全体の回答からバランスよく選びます']]},
{k:'finish',pro:true,t:'飲んだあとに、どんな印象が残ってほしい？',h:'最後に感じたい香りや余韻を選んでください。',a:[['short','すっと消えるきれいな後味',''],['sweetfinish','キャラメルのような甘い余韻',''],['fruitfinish','花や果実の華やかな香り',''],['long','カカオやスパイスの長い余韻','']]}
];
const B={brazil:['BRAZIL NATURAL','ブラジル・ナチュラル','中煎り〜中深煎り','ナチュラル','ナッツ、ミルクチョコ、キャラメル','穏やかな酸味と親しみやすい香ばしさ。ブラックにもミルクにも合わせやすい王道です。'],colombia:['COLOMBIA WASHED','コロンビア・ウォッシュド','中煎り','ウォッシュド','オレンジ、キャラメル、チョコ','甘さ、明るさ、コクがまとまりやすいバランス型です。'],costa:['COSTA RICA HONEY','コスタリカ・ハニー','中浅煎り〜中煎り','ハニー','はちみつ、キャラメル、赤い果実','やさしい甘さとほどよい果実感、まろやかな口当たりを楽しめます。'],guatemala:['GUATEMALA WASHED','グアテマラ・ウォッシュド','中深煎り','ウォッシュド','カカオ、黒糖、アーモンド','しっかりしたコーヒー感と上品な甘さ。ミルクとも好相性です。'],ethiopiaW:['ETHIOPIA WASHED','エチオピア・ウォッシュド','浅煎り〜中浅煎り','ウォッシュド','ジャスミン、レモン、紅茶','花や柑橘を思わせる香りと透明感を楽しめます。'],ethiopiaN:['ETHIOPIA NATURAL','エチオピア・ナチュラル','浅煎り〜中煎り','ナチュラル','ベリー、桃、赤ワイン','果実の甘い香りが分かりやすい、華やかなタイプです。'],kenya:['KENYA WASHED','ケニア・ウォッシュド','浅煎り〜中浅煎り','ウォッシュド','カシス、柑橘、黒糖','鮮明な果実味と甘い余韻。明るい酸味を楽しみたい方に向きます。'],indonesia:['INDONESIA WET-HULLED','インドネシア・スマトラ式','中深煎り〜深煎り','スマトラ式','ダークチョコ、ハーブ、スパイス','穏やかな酸味としっかりした飲みごたえ、長い余韻が特徴です。'],panama:['PANAMA GESHA WASHED','パナマ・ゲイシャ／ウォッシュド','浅煎り','ウォッシュド','ベルガモット、ジャスミン、白桃','紅茶を思わせる繊細さと、花のような華やかさを楽しめます。'],anaerobic:['COLOMBIA ANAEROBIC','コロンビア・アナエロビック','浅煎り〜中煎り','嫌気性発酵','トロピカルフルーツ、洋酒、スパイス','発酵由来の強い香りを楽しむ、個性的なタイプです。'],yemen:['YEMEN NATURAL','イエメン・ナチュラル','中煎り','ナチュラル','ドライフルーツ、カカオ、スパイス','乾いた果実、カカオ、香辛料が重なる複雑な余韻を楽しめます。']};
const W={flavor:{classic:{brazil:6,guatemala:4,colombia:3},sweet:{costa:6,colombia:3},floral:{ethiopiaW:6,panama:5,kenya:2},fruit:{ethiopiaN:6,kenya:4,anaerobic:4},deep:{indonesia:6,guatemala:5,yemen:4}},acid:{low:{indonesia:6,brazil:4,guatemala:4},mild:{costa:5,colombia:5},high:{kenya:6,ethiopiaW:4,panama:4,ethiopiaN:4},unknown:{colombia:4,costa:3,brazil:3}},body:{clean:{ethiopiaW:5,panama:4,colombia:3},soft:{costa:6,brazil:3,ethiopiaN:3},balanced:{colombia:6,guatemala:3,costa:3},rich:{indonesia:6,guatemala:5,yemen:4,anaerobic:3}},drink:{black:{costa:3,colombia:3,ethiopiaW:3},milk:{guatemala:6,brazil:5,indonesia:4},ice:{kenya:4,ethiopiaN:4,anaerobic:3},variety:{colombia:4,costa:4,brazil:3}},adventure:{safe:{brazil:5,colombia:5,costa:4},medium:{ethiopiaW:4,ethiopiaN:4,costa:3,kenya:3},wild:{anaerobic:8,yemen:6,panama:5}},process:{washed:{ethiopiaW:7,kenya:6,panama:6,colombia:5},honey:{costa:9},natural:{ethiopiaN:7,yemen:6,brazil:4},ferment:{anaerobic:10},neutral:{colombia:4,costa:4}},finish:{short:{ethiopiaW:6,colombia:4},sweetfinish:{costa:7,brazil:4,colombia:4},fruitfinish:{kenya:6,ethiopiaN:6,panama:5},long:{indonesia:7,yemen:6,guatemala:5}}};
let mode='quick',screen='start',step=0,ans={}; const active=()=>qs.filter(q=>mode==='deep'||!q.pro);
function rank(){const s={};Object.keys(B).forEach(k=>s[k]=0);Object.entries(ans).forEach(([q,a])=>Object.entries((W[q] && W[q][a]) || {}).forEach(([k,n])=>s[k]+=n));return Object.keys(s).sort((a,b)=>s[b]-s[a])}
function challenge(p,l){if(ans.adventure==='wild')return l.find(x=>x!==p&&['anaerobic','yemen','panama'].includes(x))||l[2];if(['brazil','colombia','guatemala','indonesia'].includes(p))return ans.acid==='low'?'ethiopiaN':'ethiopiaW';if(['ethiopiaW','kenya','panama'].includes(p))return'costa';if(p==='costa')return'ethiopiaW';if(p==='ethiopiaN')return'anaerobic';return'yemen'}
function start(){screen='start';stage.innerHTML='<p class="intro">普段好きな味や飲み方から、おすすめの産地・精製方法・焙煎度をご案内します。専門知識は必要ありません。</p><div class="modes"><button type="button" class="mode" data-m="quick"><b>QUICK 5 QUESTIONS</b><strong>気軽に診断</strong><span>味、酸味、口当たり、飲み方、新しい味への興味から選びます。</span></button><button type="button" class="mode" data-m="deep"><b>DEEP 7 QUESTIONS</b><strong>じっくり診断</strong><span>5問に加えて、精製方法による風味と余韻の好みまで確認します。</span></button></div>';stage.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;step=0;ans={};screen='quiz';quiz()}))}
function quiz(){const a=active(),q=a[step];stage.innerHTML='<div class="progress"><div class="bar" style="width:'+((step+1)/a.length*100)+'%"></div></div><div class="meta"><span>'+(mode==='quick'?'QUICK MODE':'DEEP MODE')+'</span><span>'+(step+1)+' / '+a.length+'</span></div><div class="q"><h2>Q'+(step+1)+'　'+q.t+'</h2><div class="help">'+q.h+'</div>'+(q.i?'<div class="info">'+q.i+'</div>':'')+'<div class="opts">'+q.a.map(x=>'<button type="button" class="opt '+(ans[q.k]===x[0]?'selected':'')+'" data-v="'+x[0]+'"><b>'+x[1]+'</b>'+(x[2]?'<small>'+x[2]+'</small>':'')+'</button>').join('')+'</div><div class="nav"><button type="button" class="btn back">'+(step?'戻る':'モード選択へ')+'</button><button type="button" class="btn next" '+(!ans[q.k]?'disabled':'')+'>'+(step===a.length-1?'結果を見る':'次へ')+'</button></div></div>';stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',e=>{ans[q.k]=b.dataset.v;e.currentTarget.blur();quiz()}));stage.querySelector('.back').addEventListener('click',()=>{if(step){step--;quiz()}else start()});stage.querySelector('.next').addEventListener('click',()=>{if(!ans[q.k])return;if(step<a.length-1){step++;quiz()}else result()})}
function card(k,type,en,jp){const r=B[k];return '<section class="result '+type+'"><span class="tag">'+en+'｜'+jp+'</span><h3>'+r[0]+'</h3><div class="jp">'+r[1]+'</div><p>'+r[5]+'</p><div class="specs"><div class="spec"><b>焙煎度の目安</b>'+r[2]+'</div><div class="spec"><b>精製方法</b>'+r[3]+'</div><div class="spec"><b>味のイメージ</b>'+r[4]+'</div></div>'+(type==='best'?'<div class="shop"><b>お店で伝えるなら</b><br>「'+r[1]+'で、'+r[4].split('、').slice(0,2).join('や')+'を感じる豆はありますか？」</div>':'')+'</section>'}
function result(){screen='result';const l=rank(),p=l[0],s=l[1],c=challenge(p,l);stage.innerHTML='<div class="result-intro"><div class="en">YOUR COFFEE MATCH</div><h2>あなたにおすすめの一杯</h2></div>'+card(p,'best','BEST MATCH','好みに最も近い一杯')+card(s,'second','ANOTHER CHOICE','近い好みを、違う方向から')+card(c,'new','TRY SOMETHING NEW','新しい味への一杯')+'<div class="foot">※産地や精製方法だけで味が決まるわけではありません。品種、農園、焙煎度、抽出によって変化します。<br>※ハニーは蜂蜜を加えたものではありません。アナエロビックは酸素を制限した環境を利用する発酵工程です。</div><div class="actions"><button type="button" class="btn restart">もう一度診断する</button></div>';stage.querySelector('.restart').addEventListener('click',start)}
try{start()}catch(err){stage.innerHTML='<div class="info"><b>診断を開始できませんでした。</b><br>このファイルをプレビューではなくSafari、Chrome、Edgeで開いてください。<br><small>'+String(err.message||err)+'</small></div>'}})();
</script></body></html>
